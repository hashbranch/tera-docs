name: Public docs consistency
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest tests -q
      - run: python scripts/public_docs.py
      - run: git diff --exit-code -- '*.mdx' llms.txt llms-full.txt skill.md
